[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm-prusa"
version = "1.3.1"
description = "Simulation-first SPM Prusa operator software"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<3",
    "pyserial>=3.5,<4",
    "PyQt6>=6.11,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"